name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build
      - run: uv run pytest -q
      - run: uv run python tools/check_no_secrets.py
      - run: uv run python packaging/make_icon.py
      - run: uv run pyinstaller --noconfirm packaging/tgmcp-desk.spec
      - name: Zip
        shell: pwsh
        run: |
          $name = "TGMCP-Desk-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path "dist/TGMCP Desk" -DestinationPath $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  " + $name | Out-File -Encoding ascii "$name.sha256"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --title "TGMCP Desk ${{ github.ref_name }}" --notes "未签名的测试版。首次运行 Windows 可能提示「已保护你的电脑」，点「更多信息 → 仍要运行」。" TGMCP-Desk-*.zip TGMCP-Desk-*.zip.sha256
