[project]
name = "tgmcp-desk"
version = "0.1.0.dev0"
description = "Unofficial desktop manager for chigwell/telegram-mcp: guided install, login, chat allowlist and tray control."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Gsx.cheng" }]
dependencies = [
    "PySide6-Essentials>=6.7",
    "platformdirs>=4.2",
]

[project.scripts]
tgmcp-desk = "tgmcp_desk.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgmcp_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is left to `ruff format`; long Chinese UI strings are not split.
ignore = ["E501"]
